appId: zlanx.film.desktop
productName: 蓝星影视
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Prisma Client 已被 Rollup 编进 out/main（入口 + 分块）；迁移 SQL 走下面的 extraResources，
  # 这两份源码/产物不需要再进 app.asar
  - "!generated/*"
  - "!prisma/*"
  # data/ 是 dev 用的本地库，用户数据始终落在 userData，不能跟着安装包走
  - "!data/*"
asarUnpack:
  - resources/**
  # better-sqlite3 的原生模块必须从 asar 解包：asar 里的 .node 是没法 dlopen 的
  - "**/node_modules/better-sqlite3/**"
extraResources:
  # 迁移 SQL：启动时由 src/main/lib/migrate.ts 按顺序执行（等价于 prisma migrate deploy）
  - from: prisma/migrations
    to: migrations
win:
  executableName: zlanx-film-desktop
  # Windows 签名（可选，消除 SmartScreen 的"未知发布者"）：
  # 同样复用 CSC_LINK（base64 后的 .pfx）+ CSC_KEY_PASSWORD，electron-builder 会自动签 exe / nsis。
  # 走 Azure Code Signing 时改用 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD。
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 由 build/icon.png（1024×1024）在打包时转成 icns，不需要手工准备 .icns
  icon: build/icon.png
  # hardenedRuntime 默认就是 true，显式写出来：公证（notarize）要求它必须开启
  hardenedRuntime: true
  # 主进程与子进程（渲染 / 工具进程）用同一份 entitlements
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 打包机本地的 Gatekeeper 预检：慢，且 CI 上必失败（未公证），判定交给 Apple 服务端
  gatekeeperAssess: false
  # arch 不在这里写死：CI 用 --x64 / --arm64 分别出两个架构（见 .github/workflows/release.yml）
  target:
    - dmg
    # zip 是 macOS 上自动更新（electron-updater）唯一支持的格式，dmg 只给人手装
    - zip
  # 公证默认关闭：本地打包没有 Apple 凭据会直接失败。
  # CI 里配齐 APPLE_* / CSC_* secrets 后，由 release.yml 追加 --config.mac.notarize=true 打开。
  notarize: false
  # 签名身份留空 → electron-builder 自动挑钥匙串里的 "Developer ID Application"。
  # CI 上通过 CSC_LINK(base64 的 .p12) + CSC_KEY_PASSWORD 临时导入，不需要钥匙串。
  # identity: "Developer ID Application: xxx (TEAMID)"
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
