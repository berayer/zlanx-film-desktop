name: Release

# 打 tag（v1.0.0 这种）自动构建 macOS(arm64) + Windows(x64) 产物并创建 GitHub Release；
# 也可以手动在 Actions 页面点 Run workflow 只出产物（不会创建 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macOS 产物只能在 macOS 上构建（hdiutil / dmg 都是 macOS 独有工具）。
    # 只出 arm64：不再维护 Intel 版本（如需 x64，把 os 换成 macos-13、--arm64 换成 --x64）
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 不能用 --ignore-scripts：postinstall 里的 `electron-builder install-app-deps`
      # 负责把 better-sqlite3 按当前平台 + 当前 Electron ABI 重新编译
      # （electron-builder.yml 里 npmRebuild: false，打包阶段不会再编译一次）
      - run: pnpm install --frozen-lockfile

      # 含 typecheck（node / web 两份）+ prisma generate + electron-vite build。
      # 注意：插件源码那份（typecheck:plugin）不在这里跑 —— plugin-src/ 是本地私有目录，未入库
      - run: pnpm build

      # --publish never：electron-builder.yml 里的 publish 指向占位地址，
      # 这里只出产物，上传 Release 交给下面的 release job
      #
      # 不做代码签名 / 公证：CSC_IDENTITY_AUTO_DISCOVERY=false 让 electron-builder 直接跳过签名，
      # 不去钥匙串里找证书（否则它会拿空凭据去跑 codesign 然后失败）。
      - name: Package (dmg + zip)
        run: pnpm exec electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 同样不签名（Windows 上表现为 SmartScreen 的"未知发布者"提示，不影响安装）
      - name: Package (nsis)
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    # GitHub Actions 表达式的字符串字面量只能用单引号，双引号会被解析成 Unexpected symbol
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist-release
          merge-multiple: true

      # 手动重跑时 Release 可能已存在，这时改成往已有 Release 覆盖上传
      - name: Create or update release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist-release/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1) .npmrc 把 Electron / electron-builder 二进制指向 npmmirror（国内加速）。
#    若 CI 上下载很慢，临时注释掉 electron-builder.yml 的 electronDownload.mirror 即可走官方源。
# 2) 产物一律不做代码签名 / 公证（没有 Apple Developer 证书，也不配任何 CSC_* / APPLE_* 凭据）：
#    两个 job 都设了 CSC_IDENTITY_AUTO_DISCOVERY=false，electron-builder 会直接跳过签名。
#    副作用：macOS 用户首次打开会被 Gatekeeper 拦（"已损坏，无法打开"），需右键 → 打开；
#    Windows 会提示"未知发布者"，允许即可。
#    将来要签名公证，再配 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
#    APPLE_TEAM_ID，并去掉 CSC_IDENTITY_AUTO_DISCOVERY、把 electron-builder.yml 的 notarize 打开。
# 3) 需要 Linux 产物时再加一个 ubuntu-latest 的 job（AppImage / deb 只能在 Linux 上构建）。
