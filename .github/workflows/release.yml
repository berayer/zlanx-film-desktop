name: Release

# 打 tag（v1.0.0 这种）自动构建全平台产物并创建 GitHub Release；
# 也可以手动在 Actions 页面点 Run workflow 只出产物（不会创建 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    # macOS 产物只能在 macOS 上构建（codesign / hdiutil / dmg 都是 macOS 独有工具）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13 # Intel
            arch: x64
          - os: macos-14 # Apple Silicon
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 不能用 --ignore-scripts：postinstall 里的 `electron-builder install-app-deps`
      # 负责把 better-sqlite3 按当前平台 + 当前 Electron ABI 重新编译
      # （electron-builder.yml 里 npmRebuild: false，打包阶段不会再编译一次）
      - run: pnpm install --frozen-lockfile

      # 含 typecheck（node/web/plugin 三份）+ prisma generate + electron-vite build
      - run: pnpm build

      # --publish never：electron-builder.yml 里的 publish 指向占位地址，
      # 这里只出产物，上传 Release 交给下面的 release job
      #
      # 公证只在配齐 Apple 凭据时才开（--config.mac.notarize=true）：
      # 没配 secrets 时（比如 fork 上手动跑）仍然能出产物，只是未公证。
      - name: Package (dmg + zip)
        run: |
          set -euo pipefail
          # 不用数组：macOS runner 自带的 bash 3.2 在 set -u 下展开空数组会报 unbound variable
          NOTARIZE_FLAG=""
          if [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            NOTARIZE_FLAG="--config.mac.notarize=true"
          else
            echo "::warning::Apple 凭据未配齐，本次产物未签名/未公证（Gatekeeper 会拦截）"
          fi
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never $NOTARIZE_FLAG
        env:
          # 签名：Developer ID Application 证书导出的 .p12 做 base64 后放这里
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证：Apple 账号 + App 专用密码 + 团队 ID
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 也可用 App Store Connect API Key 替代上面两项账号密码：
          # APPLE_API_KEY（.p8 内容）/ APPLE_API_KEY_ID / APPLE_API_ISSUER_ID

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 可选签名：配了 WIN_CSC_* 就签，没配就直接出未签名的 exe
      # （平台前缀变量 WIN_CSC_LINK 会覆盖通用的 CSC_LINK，避免和 macOS 的 .p12 混用）
      - name: Package (nsis)
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, "refs/tags/v")
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist-release
          merge-multiple: true

      # 手动重跑时 Release 可能已存在，这时改成往已有 Release 覆盖上传
      - name: Create or update release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist-release/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1) .npmrc 把 Electron / electron-builder 二进制指向 npmmirror（国内加速）。
#    若 CI 上下载很慢，临时注释掉 electron-builder.yml 的 electronDownload.mirror 即可走官方源。
# 2) macOS 签名 + 公证：在仓库 Settings → Secrets and variables → Actions 里配
#      CSC_LINK                     = base64 -w0 DeveloperID.p12  （Developer ID Application 证书）
#      CSC_KEY_PASSWORD             = 导出 .p12 时设的密码
#      APPLE_ID                     = Apple 开发者账号邮箱
#      APPLE_APP_SPECIFIC_PASSWORD  = 在 appleid.apple.com 生成的 App 专用密码
#      APPLE_TEAM_ID                = 开发者账号 Membership 页的 Team ID
#    配齐后 mac job 会自动追加 --config.mac.notarize=true；
#    没配也能构建，但产物未签名未公证 → 用户打开会被 Gatekeeper 拦（"已损坏，无法打开"），
#    只能右键 → 打开绕过。
# 3) Windows 可选签名用 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD（.pfx/.p12 的 base64）。
# 4) 需要 Linux 产物时再加一个 ubuntu-latest 的 job（AppImage / deb 只能在 Linux 上构建）。
